<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3 - Form Validation</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ffffff; display: flex; justify-content: center; padding-top: 40px; }
    .box { width: 340px; border: 2px solid #1e66d0; border-radius: 10px; padding: 24px; }
    h2 { color: #1e66d0; text-align: center; margin-top: 0; }
    label { color: #1e66d0; font-size: 14px; display: block; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #1e66d0; border-radius: 5px; font-size: 15px; }
    .error { color: #d62828; font-size: 12px; min-height: 14px; margin-top: 2px; }
    button { width: 100%; margin-top: 16px; padding: 10px; background: #1e66d0; color: #ffffff; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    button:hover { background: #154fa3; }
    #success { text-align: center; color: #1e66d0; font-weight: bold; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Registration Form</h2>
    <form id="regForm" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Full name">
      <div class="error" id="nameError"></div>

      <label for="email">Email</label>
      <input type="text" id="email" placeholder="you@example.com">
      <div class="error" id="emailError"></div>

      <label for="phone">Phone</label>
      <input type="text" id="phone" placeholder="10-digit phone number">
      <div class="error" id="phoneError"></div>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters">
      <div class="error" id="passwordError"></div>

      <button type="submit">Register</button>
    </form>
    <div id="success"></div>
  </div>

  <script>
    document.getElementById("regForm").addEventListener("submit", function (e) {
      e.preventDefault();

      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var phone = document.getElementById("phone").value.trim();
      var password = document.getElementById("password").value;

      var valid = true;

      // clear old messages
      document.getElementById("nameError").textContent = "";
      document.getElementById("emailError").textContent = "";
      document.getElementById("phoneError").textContent = "";
      document.getElementById("passwordError").textContent = "";
      document.getElementById("success").textContent = "";

      if (name === "") {
        document.getElementById("nameError").textContent = "Name is required";
        valid = false;
      } else if (name.length < 3) {
        document.getElementById("nameError").textContent = "Name must be at least 3 characters";
        valid = false;
      }

      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        document.getElementById("emailError").textContent = "Email is required";
        valid = false;
      } else if (!emailPattern.test(email)) {
        document.getElementById("emailError").textContent = "Enter a valid email address";
        valid = false;
      }

      var phonePattern = /^[0-9]{10}$/;
      if (phone === "") {
        document.getElementById("phoneError").textContent = "Phone number is required";
        valid = false;
      } else if (!phonePattern.test(phone)) {
        document.getElementById("phoneError").textContent = "Phone must be exactly 10 digits";
        valid = false;
      }

      if (password === "") {
        document.getElementById("passwordError").textContent = "Password is required";
        valid = false;
      } else if (password.length < 6) {
        document.getElementById("passwordError").textContent = "Password must be at least 6 characters";
        valid = false;
      }

      if (valid) {
        document.getElementById("success").textContent = "Registration successful!";
        document.getElementById("regForm").reset();
      }
    });
  </script>
</body>
</html>
