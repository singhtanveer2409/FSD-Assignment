<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 1 - JavaScript Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #ffffff; display: flex; justify-content: center; padding-top: 60px; }
    .box { width: 320px; border: 2px solid #1e66d0; border-radius: 10px; padding: 24px; }
    h2 { color: #1e66d0; text-align: center; margin-top: 0; }
    input, select, button { width: 100%; padding: 10px; margin-top: 12px; font-size: 16px; box-sizing: border-box; border: 1px solid #1e66d0; border-radius: 5px; }
    button { background: #1e66d0; color: #ffffff; cursor: pointer; border: none; }
    button:hover { background: #154fa3; }
    #result { margin-top: 16px; text-align: center; font-size: 18px; color: #1e66d0; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Calculator</h2>
    <input type="number" id="num1" placeholder="First number">
    <select id="operator">
      <option value="+">Addition (+)</option>
      <option value="-">Subtraction (-)</option>
      <option value="*">Multiplication (*)</option>
      <option value="/">Division (/)</option>
    </select>
    <input type="number" id="num2" placeholder="Second number">
    <button onclick="calculate()">Calculate</button>
    <div id="result"></div>
  </div>

  <script>
    function add(a, b) { return a + b; }
    function subtract(a, b) { return a - b; }
    function multiply(a, b) { return a * b; }
    function divide(a, b) {
      if (b === 0) return "Cannot divide by zero";
      return a / b;
    }

    function calculate() {
      var n1 = document.getElementById("num1").value;
      var n2 = document.getElementById("num2").value;
      var op = document.getElementById("operator").value;
      var result = document.getElementById("result");

      if (n1 === "" || n2 === "") {
        result.textContent = "Please enter both numbers";
        return;
      }

      n1 = Number(n1);
      n2 = Number(n2);
      var answer;

      switch (op) {
        case "+": answer = add(n1, n2); break;
        case "-": answer = subtract(n1, n2); break;
        case "*": answer = multiply(n1, n2); break;
        case "/": answer = divide(n1, n2); break;
      }

      result.textContent = "Result: " + answer;
    }
  </script>
</body>
</html>
