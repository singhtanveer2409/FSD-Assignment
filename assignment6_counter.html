<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 6 - React Counter</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #ffffff; display: flex; justify-content: center; padding-top: 80px; }
    .box { width: 300px; border: 2px solid #1e66d0; border-radius: 10px; padding: 24px; text-align: center; }
    h2 { color: #1e66d0; margin-top: 0; }
    .count { font-size: 56px; color: #1e66d0; margin: 16px 0; }
    button { background: #1e66d0; color: #ffffff; border: none; border-radius: 5px; padding: 10px 16px; margin: 0 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #154fa3; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function Counter() {
      const [count, setCount] = useState(0);

      return (
        <div className="box">
          <h2>Counter</h2>
          <div className="count">{count}</div>
          <button onClick={() => setCount(count + 1)}>Increment</button>
          <button onClick={() => setCount(count - 1)}>Decrement</button>
          <button onClick={() => setCount(0)}>Reset</button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Counter />);
  </script>
</body>
</html>
